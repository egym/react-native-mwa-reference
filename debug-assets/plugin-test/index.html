<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Plugin test</title>
    <style>
      body {
        margin: 0;
        padding: max(24px, env(safe-area-inset-top)) 16px
          max(24px, env(safe-area-inset-bottom));
        font-family: -apple-system, system-ui, sans-serif;
      }
      button {
        display: block;
        width: 100%;
        margin: 8px 0;
        padding: 12px;
        font-size: 16px;
      }
      #results {
        font-family: ui-monospace, monospace;
        font-size: 13px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Plugin test</h1>
    <p>
      Debug builds only. Calls EgymMwaNavigation.open with the Workouts context,
      as the Workouts demo button does.
    </p>
    <button id="open-nfc">Open NFC</button>
    <button id="open-twice">Open twice</button>
    <button id="open-other">Other app</button>
    <button id="close">Close</button>
    <div id="results"></div>
    <script>
      // Portals passes the initial context to Android through a JavaScript interface and to iOS as a global.
      const context = window.AndroidInitialContext
        ? JSON.parse(window.AndroidInitialContext.initialContext()).value
        : window.portalInitialContext.value;
      const { nfcChannel, ...workoutsContext } = context;

      // Logs the outcome only, never the context: it can hold the member's token.
      const show = line => {
        console.log(`[plugin-test] ${line}`);
        document.getElementById('results').textContent += `${line}\n`;
      };

      const open = appId =>
        Capacitor.nativePromise('EgymMwaNavigation', 'open', {
          appId,
          channel: nfcChannel,
          startingRoute: '/nfc/home',
          initialContext: { ...workoutsContext, startingRoute: '/nfc/home' },
        }).then(
          result => show(`${appId} closedBy: ${result.closedBy}`),
          error => show(`${appId} rejected: ${error.code}`),
        );

      document.getElementById('open-nfc').onclick = () => open('dcbe378a');
      document.getElementById('open-twice').onclick = () => {
        open('dcbe378a');
        open('dcbe378a');
      };
      document.getElementById('open-other').onclick = () => open('068a3720');
      document.getElementById('close').onclick = () =>
        Capacitor.nativePromise('Portals', 'publishNative', {
          topic: 'subscription',
          data: { type: 'dismiss' },
        });
    </script>
  </body>
</html>
