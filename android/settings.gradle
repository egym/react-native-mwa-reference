pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'ReactNativeMwaReference'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')

// React Native autolinking skips Capacitor plugins, so the EGYM package and Capacitor core build from node_modules.
// SQLite and the NFC plugin reach Android only as Gradle modules; with the linked package they sit in its node_modules.
include ':capacitor-android', ':egym-capacitor-mwa-navigation', ':capacitor-community-sqlite', ':capacitor-nfc-pass-wallet'
project(':capacitor-android').projectDir = new File(settingsDir, '../node_modules/@capacitor/android/capacitor')
project(':egym-capacitor-mwa-navigation').projectDir = new File(settingsDir, '../node_modules/@egym/capacitor-mwa-navigation/android')
project(':capacitor-community-sqlite').projectDir = new File(settingsDir, '../node_modules/@egym/capacitor-mwa-navigation/node_modules/@capacitor-community/sqlite/android')
project(':capacitor-nfc-pass-wallet').projectDir = new File(settingsDir, '../node_modules/@egym/capacitor-mwa-navigation/node_modules/@egym/capacitor-nfc-pass-wallet/android')
